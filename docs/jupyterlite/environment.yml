# The kernel environment for the documentation's JupyterLite site, which runs the
# gallery examples in the browser. Compiled packages must come from emscripten-forge.
# The pip entries are pure Python and installed with --no-deps, so their dependencies
# have to be listed here. ../.. installs this checkout of NiMARE.
name: xeus-python-kernel
channels:
  - https://prefix.dev/emscripten-forge-4x
  - https://prefix.dev/conda-forge
dependencies:
  - xeus-python
  - python=3.13
  # compiled: emscripten-forge wasm builds
  - numpy
  - scipy
  - pandas
  - scikit-learn=1.8  # nilearn excludes 1.9.0
  - statsmodels
  - matplotlib
  - numba
  - llvmlite
  - lxml
  - pyyaml
  - wrapt   # pymare
  - sympy   # pymare
  # pure python: conda-forge noarch
  - nibabel
  - nilearn>=0.12,<0.14
  - sparse
  - patsy
  - joblib
  - lazy_loader
  - jinja2
  - plotly
  - seaborn
  - tqdm
  - requests
  - pip:
    - pymare
    - fuzzywuzzy
    - cognitiveatlas
    - ridgeplot
    - ../..
