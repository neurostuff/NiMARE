        ,\"abstract\":\"The neural mechanisms associated with the limited capacity\
        \ of working memory has long been studied, but it is still unclear which neural\
        \ regions are associated with the precision of visual working memory. Here,\
        \ an orientation recall task for estimating the trial-wise precision of visual\
        \ working memory was performed and then repeated two weeks later in an fMRI\
        \ scanner. Results showed that activity in frontal and parietal regions during\
        \ working memory maintenance scaled with working memory load, but not with\
        \ the precision of working memory (i.e., recall error in radians). Conversely,\
        \ activity in the lateral occipital complex (LOC) during working memory maintenance\
        \ was not affected by memory load, but rather, correlated with working memory\
        \ precision on a trial-by-trial basis. Moreover, activity in LOC also correlated\
        \ with the individual participant's precision of working memory from a separate\
        \ behavioral experiment. Interestingly, a region within the prefrontal cortex,\
        \ the inferior frontal junction (IFJ), exhibited greater functional connectivity\
        \ with LOC when the working memory load increased. Together, our findings\
        \ provide unique evidence that the LOC supports visual working memory precision,\
        \ while communication between the IFJ and LOC varies based on working memory\
        \ load demands. These results suggest an intriguing possibility that distinct\
        \ neural mechanisms may be associated with general content (load) or detailed\
        \ information (precision) of working memory.\",\"isOpenAccess\":true,\"openAccessPdf\"\
        :{\"url\":\"https://doi.org/10.1016/j.neuroscience.2019.11.037\",\"status\"\
        :\"HYBRID\",\"license\":\"CCBYNCND\",\"disclaimer\":\"Notice: Paper or abstract\
        \ available at https://api.unpaywall.org/v2/10.1016/j.neuroscience.2019.11.037?email=<INSERT_YOUR_EMAIL>\
        \ or https://doi.org/10.1016/j.neuroscience.2019.11.037, which is subject\
        \ to the license by the author or copyright owner provided with this content.\
        \ Please go to the source to verify the license and copyright information\
        \ for your use.\"},\"publicationDate\":\"2019-12-05\"}}},\"name\":\"Neural\
        \ correlates underlying the precision of visual working memory.\",\"description\"\
        :\"The neural mechanisms associated with the limited capacity of working memory\
        \ has long been studied, but it is still unclear which neural regions are\
        \ associated with the precision of visual working memory. Here, an orientation\
        \ recall task for estimating the trial-wise precision of visual working memory\
        \ was performed and then repeated two weeks later in an fMRI scanner. Results\
        \ showed that activity in frontal and parietal regions during working memory\
        \ maintenance scaled with working memory load, but not with the precision\
        \ of working memory (i.e., recall error in radians). Conversely, activity\
        \ in the lateral occipital complex (LOC) during working memory maintenance\
        \ was not affected by memory load, but rather, correlated with working memory\
        \ precision on a trial-by-trial basis. Moreover, activity in LOC also correlated\
        \ with the individual participant's precision of working memory from a separate\
        \ behavioral experiment. Interestingly, a region within the prefrontal cortex,\
        \ the inferior frontal junction (IFJ), exhibited greater functional connectivity\
        \ with LOC when the working memory load increased. Together, our findings\
        \ provide unique evidence that the LOC supports visual working memory precision,\
        \ while communication between the IFJ and LOC varies based on working memory\
        \ load demands. These results suggest an intriguing possibility that distinct\
        \ neural mechanisms may be associated with general content (load) or detailed\
        \ information (precision) of working memory.\",\"publication\":\"Neuroscience\"\
