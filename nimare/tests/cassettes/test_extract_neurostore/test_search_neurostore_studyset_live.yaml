        \ neural correlates as a function of training, were assessed. While both working\
        \ memory processes activated an extended frontoparietal\u2013cerebellar network,\
        \ only the manipulation of items within working memory also recruited the\
        \ anterior striatum. The intervention effect on the neural correlates was\
        \ small, but decreased activation in areas relevant for working memory could\
        \ be observed, with activation changes correlating with behavioural change.\
        \ Moreover, training seemed to result in decreased functional connectivity\
        \ when pure maintenance was required, and in a reorganization of functional\
