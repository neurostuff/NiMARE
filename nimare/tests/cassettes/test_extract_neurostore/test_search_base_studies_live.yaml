        :\"Working memory training increases neural efficiency in Parkinson\u2019\
        s disease: a randomized controlled trial\",\"description\":\" \\nImpairment\
        \ of working memory and executive functions is already frequently observed\
        \ in early stages of Parkinson\u2019s disease. Improvements in working memory\
        \ performance in this cohort could potentially be achieved via working memory\
        \ training. However, the specific neural mechanisms underlying different working\
        \ memory processes such as maintenance as opposed to manipulation are largely\
        \ under-investigated in Parkinson\u2019s disease. Moreover, the plasticity\
        \ of these correlates as a function of working memory training is currently\
        \ unknown in this population. Thus, the working memory subprocesses of maintenance\
        \ and manipulation were assessed in 41 cognitively healthy patients with Parkinson\u2019\
        s disease using a newly developed working memory paradigm and functional MRI.\
        \ Nineteen patients were randomized to a 5-week home-based digital working\
        \ memory training intervention while the remaining patients entered a control,\
        \ wait list condition. Working memory task-related activation patterns and\
        \ context-dependent functional connectivity, as well as the change of these\
        \ neural correlates as a function of training, were assessed. While both working\
        \ memory processes activated an extended frontoparietal\u2013cerebellar network,\
        \ only the manipulation of items within working memory also recruited the\
        \ anterior striatum. The intervention effect on the neural correlates was\
        \ small, but decreased activation in areas relevant for working memory could\
        \ be observed, with activation changes correlating with behavioural change.\
        \ Moreover, training seemed to result in decreased functional connectivity\
        \ when pure maintenance was required, and in a reorganization of functional\
        \ connectivity when items had to be manipulated. In accordance with the neural\
        \ efficacy hypothesis, training resulted in overall reduced activation and\
        \ reorganized functional connectivity, with a differential effect on the different\
        \ working memory processes under investigation. Now, larger trials including\
        \ follow-up examinations are needed to further explore the long-term effects\
        \ of such interventions on a neural level and to estimate the clinical relevance\
        \ to potentially delay cognitive decline in cognitively healthy patients with\
        \ Parkinson\u2019s disease. \\n  \\nGiehl et al. report the effects of working\
        \ memory training on neural correlates underlying working memory in Parkinson\u2019\
        s disease. In accordance with the neural efficacy hypothesis, an overall reduction\
        \ of neural activation and the reorganization of functional connectivity was\
        \ observed following the intervention. \\n   Graphical Abstract  \\n  \\n\
