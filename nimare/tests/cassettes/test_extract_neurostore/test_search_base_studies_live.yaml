        },\"ISOAbbreviation\":\"Neuroscience\"},\"Abstract\":{\"AbstractText\":\"\
        The neural mechanisms associated with the limited capacity of working memory\
        \ (WM) has long been studied, but it is still unclear which neural regions\
        \ are associated with the precision of visual WM. Here, an orientation recall\
        \ task for estimating the trial-wise precision of visual WM was performed\
        \ and then repeated two weeks later in an fMRI scanner. Results showed that\
        \ activity in frontal and parietal regions during WM maintenance scaled with\
        \ WM load, but not with the precision of WM (i.e., recall error in radians).\
        \ Conversely, activity in the lateral occipital complex (LOC) during WM maintenance\
        \ was not affected by memory load, but rather, correlated with WM precision\
        \ on a trial-by-trial basis. Moreover, activity in LOC also correlated with\
        \ the individual participant's precision of WM from a separate behavioral\
        \ experiment. Interestingly, a region within the prefrontal cortex, the inferior\
        \ frontal junction (IFJ), exhibited greater functional connectivity with LOC\
        \ when the WM load increased. Together, our findings provide unique evidence\
        \ that the LOC supports visual WM precision, while communication between the\
        \ IFJ and LOC varies based on WM load demands. These results suggest an intriguing\
        \ possibility that distinct neural mechanisms may be associated with general\
        \ content (load) or detailed information (precision) of WM.\",\"CopyrightInformation\"\
