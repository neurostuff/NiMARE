# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"  # also compiles the JupyterLite kernel's .pyc, so match its Python
  jobs:
    post_install:
      # micromamba creates the JupyterLite kernel environment (docs/sphinxext/nimare_lite.py).
      - curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$READTHEDOCS_VIRTUALENV_PATH" bin/micromamba

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
        - cbmr
        - predictive
